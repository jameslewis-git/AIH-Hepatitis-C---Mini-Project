<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HCV Sentinel: AI-powered Hepatitis C detection and staging using machine learning on routine blood panel values.">
  <title>{% block title %}HCV Sentinel: AI Liver Staging{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // Immediate theme initializer: defaults to light (white) mode
    (function () {
      var saved = localStorage.getItem('hcv_theme');
      var theme = (saved === 'dark') ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <!-- Page Preloader -->
  <div id="pagePreloader">
    <div class="preloader-dna">
      <div class="preloader-dna-inner"></div>
    </div>
    <div class="preloader-text">Initializing HCV Sentinel</div>
    <div class="preloader-bar">
      <div class="preloader-bar-fill"></div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="app-navbar">
    <div style="max-width:1200px; margin:0 auto; padding:0 1.5rem; display:flex; align-items:center; justify-content:space-between;">

      <a class="navbar-brand" href="{{ url_for('home') }}" style="text-decoration:none;">
        <div class="brand-icon">🧬</div>
        <div>
          <div class="brand-name" style="line-height:1.1; font-weight:700; color:var(--text-primary);">HCV Sentinel</div>
          <div class="brand-sub">AI for Healthcare</div>
        </div>
      </a>

      <div style="display:flex; align-items:center; gap:0.35rem;">
        <a href="{{ url_for('home') }}" class="nav-link {% if request.endpoint == 'home' %}active-link{% endif %}">Home</a>
        <a href="{{ url_for('predict_view') }}" class="nav-link {% if request.endpoint == 'predict_view' %}active-link{% endif %}">Predict</a>
        <a href="{{ url_for('about') }}" class="nav-link {% if request.endpoint == 'about' %}active-link{% endif %}">About</a>
        <div class="nav-status">
          <div class="nav-status-dot"></div>
          <span>MODEL LIVE</span>
        </div>

        <!-- Dark / Light Mode Toggle Button -->
        <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
          <span id="themeIconSun" class="theme-toggle-icon" style="display:none;" title="Switch to Light mode">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span id="themeIconMoon" class="theme-toggle-icon" style="display:inline-flex;" title="Switch to Dark mode">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </button>
      </div>

    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="footer-text">
      HCV Sentinel <span class="footer-dot">·</span> AI for Healthcare Mini Project
      <span class="footer-dot">·</span> Academic use only (not a certified medical device)
      <span class="footer-dot">·</span> UCI HCV Dataset
    </div>
  </footer>

  <script>
    // Theme toggle handling
    (function () {
      function syncIcons(theme) {
        var sun = document.getElementById('themeIconSun');
        var moon = document.getElementById('themeIconMoon');
        if (!sun || !moon) return;
        if (theme === 'dark') {
          sun.style.display = 'inline-flex';
          moon.style.display = 'none';
        } else {
          sun.style.display = 'none';
          moon.style.display = 'inline-flex';
        }
      }

      function initTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        syncIcons(current);

        var btn = document.getElementById('themeToggleBtn');
        if (btn) {
          btn.addEventListener('click', function () {
            var active = document.documentElement.getAttribute('data-theme') || 'light';
            var next = (active === 'dark') ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('hcv_theme', next);
            syncIcons(next);
          });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTheme);
      } else {
        initTheme();
      }
    })();

    // Page preloader
    window.addEventListener('load', function () {
      const preloader = document.getElementById('pagePreloader');
      if (!preloader) return;
      setTimeout(function () {
        preloader.classList.add('fade-out');
        setTimeout(function () { preloader.classList.add('hidden'); }, 500);
      }, 1400);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
