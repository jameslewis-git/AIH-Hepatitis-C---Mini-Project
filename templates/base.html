<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HCV Sentinel — AI-powered Hepatitis C detection and staging using machine learning on routine blood panel values.">
  <title>{% block title %}HCV Sentinel — AI Liver Staging{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Page Preloader -->
  <div id="pagePreloader">
    <div class="preloader-dna">
      <div class="preloader-dna-inner"></div>
    </div>
    <div class="preloader-text">Initializing HCV Sentinel</div>
    <div class="preloader-bar">
      <div class="preloader-bar-fill"></div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="app-navbar">
    <div style="max-width:1200px; margin:0 auto; padding:0 1.5rem; display:flex; align-items:center; justify-content:space-between;">

      <a class="navbar-brand" href="{{ url_for('home') }}" style="text-decoration:none;">
        <div class="brand-icon">🧬</div>
        <div>
          <div class="brand-name" style="line-height:1.1; font-weight:700; color:var(--text-primary);">HCV Sentinel</div>
          <div class="brand-sub">AI for Healthcare</div>
        </div>
      </a>

      <div style="display:flex; align-items:center; gap:0.25rem;">
        <a href="{{ url_for('home') }}" class="nav-link {% if request.endpoint == 'home' %}active-link{% endif %}">Home</a>
        <a href="{{ url_for('predict_view') }}" class="nav-link {% if request.endpoint == 'predict_view' %}active-link{% endif %}">Predict</a>
        <a href="{{ url_for('about') }}" class="nav-link {% if request.endpoint == 'about' %}active-link{% endif %}">About</a>
        <div class="nav-status">
          <div class="nav-status-dot"></div>
          <span>MODEL LIVE</span>
        </div>
      </div>

    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="footer-text">
      HCV Sentinel <span class="footer-dot">·</span> AI for Healthcare Mini Project
      <span class="footer-dot">·</span> Academic use only — not a certified medical device
      <span class="footer-dot">·</span> UCI HCV Dataset
    </div>
  </footer>

  <script>
    // Page preloader
    window.addEventListener('load', function () {
      const preloader = document.getElementById('pagePreloader');
      if (!preloader) return;
      setTimeout(function () {
        preloader.classList.add('fade-out');
        setTimeout(function () { preloader.classList.add('hidden'); }, 500);
      }, 1400);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
